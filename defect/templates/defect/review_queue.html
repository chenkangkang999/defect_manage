<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>复核队列</title>
</head>
<body>
    <h2>待复核缺陷队列</h2>
    <a href="{% url 'dashboard' %}">统计看板</a>
    <table border="1" cellpadding="5">
        <tr>
            <th>ID</th><th>缺陷类型</th><th>检测人员</th><th>置信度</th>
            <th>模型版本</th><th>检测时间</th><th>操作</th>
        </tr>
        {% for r in records %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.defect_type.type_name }}</td>
            <td>{{ r.detect_person }}</td>
            <td>{{ r.confidence }}</td>
            <td>{{ r.model_version|default:"-" }}</td>
            <td>{{ r.detect_time }}</td>
            <td>
                <a href="{% url 'defect_detail' r.id %}">详情</a>
                <a href="{% url 'review_confirm' r.id %}" style="color:green">✓ 确认</a>
                <a href="{% url 'review_reject' r.id %}" style="color:red">✗ 驳回</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="7">队列为空，没有待复核记录</td></tr>
        {% endfor %}
    </table>
</body>
</html>
