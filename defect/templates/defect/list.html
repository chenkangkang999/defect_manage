<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>缺陷检测记录列表</title>
</head>
<body>
    <h2>缺陷检测台账</h2>
    <a href="{% url 'defect_add' %}">新增缺陷记录</a>
    <table border="1" cellpadding="5">
        <tr>
            <th>ID</th>
            <th>缺陷类型</th>
            <th>检测人员</th>
            <th>设备编号</th>
            <th>置信度</th>
            <th>检测时间</th>
            <th>操作</th>
        </tr>
        {% for r in records %}
        <tr>
            <td>{{ r.id }}</td>
            <td>{{ r.defect_type.type_name }}</td>
            <td>{{ r.detect_person }}</td>
            <td>{{ r.device_id }}</td>
            <td>{{ r.confidence }}</td>
            <td>{{ r.detect_time }}</td>
            <td>
                <a href="{% url 'defect_detail' r.id %}">详情</a>
                <a href="{% url 'defect_edit' r.id %}">编辑</a>
                <a href="{% url 'defect_delete' r.id %}">删除</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="7">暂无缺陷记录，请新增</td></tr>
        {% endfor %}
    </table>
</body>
</html>
