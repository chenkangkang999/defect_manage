<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>确认删除</title>
</head>
<body>
    <h2>确认删除这条缺陷记录？</h2>
    <p>{{ record.defect_type.type_name }} | {{ record.detect_person }}</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">确认删除</button>
    </form>
    <a href="{% url 'defect_list' %}">取消</a>
</body>
</html>
